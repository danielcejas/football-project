services:
  postgres:
    image: postgres:16
    container_name: football-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-football}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-football}
      POSTGRES_DB: ${POSTGRES_DB:-football}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - football_postgres_data:/var/lib/postgresql/data

volumes:
  football_postgres_data:
